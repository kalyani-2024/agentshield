[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.4.0"
description = "A runtime security firewall for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
# only needed to retrain the models; inference is pure Python
train = ["scikit-learn>=1.4"]
dev = ["pytest>=7.0", "httpx>=0.27", "fastapi>=0.110", "scikit-learn>=1.4"]

[project.scripts]
agentshield-api = "agentshield.api_http.app:main"

[tool.setuptools.packages.find]
include = ["agentshield*"]

[tool.setuptools.package-data]
agentshield = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
